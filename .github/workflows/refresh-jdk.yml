name: "Refresh jdk from Upstream"
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
env:
  UPSTREAM_REMOTE: https://github.com/openjdk/jdk.git
  UPSTREAM_LEYDEN: https://github.com/openjdk/leyden.git
  LOCAL_BRANCH: develop
  LOCAL_LEYDEN: leyden
  
permissions:
  contents: write

jobs:
    refresh-jdk:
        runs-on: ubuntu-latest
        name: "Update Corretto-jdk"
        if: github.repository_owner == 'corretto'
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
                ref: ${{ env.LOCAL_BRANCH }}
                
            - name: "Configure the user"
              run: |
                git config user.email "no-reply@amazon.com"
                git config user.name "corretto-github-robot"
                
            - name: "Merge openjdk/jdk:master to the corretto-jdk:develop"
              id: merge-jdk
              shell: bash
              run: bash ./.github/scripts/merge-upstream.sh $UPSTREAM_REMOTE master "Merge upstream-jdk"
                
            - name: "Update Corretto version"
              shell: bash
              run: bash ./.github/scripts/update-version.sh $UPSTREAM_REMOTE
            - name: "Push to the corretto-jdk"
              run: git push origin $LOCAL_BRANCH

            - name: "Fail on openjdk/jdk:master merge conflict"
              if: steps.merge-jdk.outputs.conflict == 'true'
              env:
                CONFLICT_COMMIT: ${{ steps.merge-jdk.outputs.conflict_commit }}
              run: |
                echo "Upstream commit $CONFLICT_COMMIT needs a manual merge. See the job summary."
                exit 1
              
            - name: "Merge openjdk/leyden:premain to leyden"
              shell: bash
              run: |
                git checkout $LOCAL_LEYDEN
                git fetch $UPSTREAM_LEYDEN premain || exit 1
                git merge -m "Merging openjdk/leyden:premain to corretto-jdk:leyden" FETCH_HEAD
                git push origin $LOCAL_LEYDEN

            - name: "Update leyden version.txt from develop"
              shell: bash
              run: |
                git checkout $LOCAL_LEYDEN
                git restore --source origin/$LOCAL_BRANCH --staged --worktree -- version.txt
                git commit -m "Automerged version.txt from $LOCAL_BRANCH to $LOCAL_LEYDEN" || true
                git push origin $LOCAL_LEYDEN
